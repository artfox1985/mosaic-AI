<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Phantom-Fliesen Vorschau</title>
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body{background:#F7F6F2;font-family:system-ui,sans-serif;padding:24px}
  .band{display:flex;align-items:center;gap:10px;margin:14px 0}
  .band b{font-size:11px;width:170px;color:#57534E}
  .zoom{zoom:3;margin:18px 0;display:flex;gap:6px;align-items:center}
  h3{font-size:12px;margin:22px 0 6px;color:#44403C}
</style>
</head>
<body>
<h3>1:1 (22px) - gelegt vs. Phantom vs. leer</h3>
<div class="band"><b>gelegt</b>
  <div class="tile blau"></div><div class="tile gelb"></div><div class="tile rot"></div>
  <div class="tile schwarz"></div><div class="tile tuerkis"></div>
</div>
<div class="band"><b>Phantom (Bonuschip)</b>
  <div class="tile blau phantom"></div><div class="tile gelb phantom"></div><div class="tile rot phantom"></div>
  <div class="tile schwarz phantom"></div><div class="tile tuerkis phantom"></div>
</div>
<div class="band"><b>leerer Platz</b>
  <div class="tile empty"></div><div class="tile empty"></div><div class="tile empty"></div>
</div>

<h3>Musterreihe wie im Spiel (3 gelegt + 3 Phantom)</h3>
<div class="prow" style="display:flex;gap:3px;padding:4px;width:max-content">
  <div class="tile sm blau"></div><div class="tile sm blau"></div><div class="tile sm blau"></div>
  <div class="tile sm blau phantom"></div><div class="tile sm blau phantom"></div><div class="tile sm blau phantom"></div>
</div>

<h3>3x Zoom - traegt der Rahmen?</h3>
<div class="zoom">
  <div class="tile blau"></div>
  <div class="tile blau phantom"></div>
  <div class="tile rot phantom"></div>
  <div class="tile schwarz phantom"></div>
  <div class="tile empty"></div>
</div>
</body>
</html>
