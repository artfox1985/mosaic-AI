[package]
name = "mosaic_rust"
version = "0.1.0"
edition = "2021"
description = "Rust engine + MCTS + self-play for Mosaic-AI, exposed to Python via PyO3"

[lib]
name = "mosaic_rust"
# cdylib: importierbares Python-Extension-Modul (.pyd/.so)
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
rand = "0.10.1"
rayon = "1"
serde_json = "1"
# Reines Rust ONNX-Inferenz (Network-Modus, Phase B) — kein libtorch/onnxruntime nötig.
tract-onnx = "0.21"
# Weg A (PREREG_gpu_inferenzpfad.md, net_ipc.rs): speicherabgebildete Dateien
# als Nutzlast-Puffer für den optionalen Torch/CUDA-IPC-Kanal. War schon
# transitiv (via tract-onnx) im Lockfile (0.9.11) — hier nur zur direkten
# Abhängigkeit erhoben, kein neuer Abhängigkeitsbaum.
memmap2 = "0.9"
# pyo3-Version wird via `cargo add` auf die neueste 3.14-kompatible gesetzt.
# Weg B (PREREG_gpu_inferenzpfad.md §6 Schritt 2, NUR Kennlinien-Messung, keine
# Verdrahtung): ort-Crate mit CUDA-Execution-Provider fuer den Kennlinien-Probe
# `examples/ort_cuda_batch_probe.rs`. Optional + `required-features` am Example
# (siehe unten), damit `cargo build`/`cargo test --lib` ohne `--features
# ort_cuda_probe` UNVERAENDERT bleiben -- kein neuer Zweig im Produktionscode.
# VERSIONS-PIN 2.0.0-rc.12 (NICHT rc.13): GEPRUEFT ueber die in `ort-sys`
# eingebettete Distributionstabelle (`build/download/dist.txt` je Version, aus
# den crates.io-Tarballs extrahiert) -- rc.12 buendelt ONNX Runtime 1.24.2 und
# bietet fuer x86_64-pc-windows-msvc einen "cu12"-Build; rc.13 (ONNX Runtime
# 1.28.0) hat den Windows-cu12-Eintrag ersatzlos gestrichen und bietet dort
# nur noch "cuda13". Torch bringt CUDA-12-DLLs mit (cu126), nicht CUDA 13 --
# rc.12 ist die NEUESTE `ort`-Version, deren Windows-CUDA-Build noch zu den
# vorhandenen Torch-DLLs passt.
ort = { version = "=2.0.0-rc.12", optional = true, features = ["cuda"] }

[features]
# Zaehlt GameState-Klone im Such-Hot-Path (mcts.rs/net_mcts.rs) via AtomicUsize.
# Nur fuers Profiling gedacht -- im Normalbetrieb aus (Zero-Cost, da wegkompiliert).
clone_profiling = []
# Schaltet die optionale ort-Abhaengigkeit frei (siehe Kommentar oben).
ort_cuda_probe = ["dep:ort"]

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "clone_cost"
harness = false

[[example]]
name = "ort_cuda_batch_probe"
required-features = ["ort_cuda_probe"]
