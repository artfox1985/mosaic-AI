[package]
name = "mosaic_rust"
version = "0.1.0"
edition = "2021"
description = "Rust engine + MCTS + self-play for Mosaic-AI, exposed to Python via PyO3"

[lib]
name = "mosaic_rust"
# cdylib: importierbares Python-Extension-Modul (.pyd/.so)
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
rand = "0.10.1"
rayon = "1"
serde_json = "1"
# Reines Rust ONNX-Inferenz (Network-Modus, Phase B) — kein libtorch/onnxruntime nötig.
tract-onnx = "0.21"
# Weg A (PREREG_gpu_inferenzpfad.md, net_ipc.rs): speicherabgebildete Dateien
# als Nutzlast-Puffer für den optionalen Torch/CUDA-IPC-Kanal. War schon
# transitiv (via tract-onnx) im Lockfile (0.9.11) — hier nur zur direkten
# Abhängigkeit erhoben, kein neuer Abhängigkeitsbaum.
memmap2 = "0.9"
# pyo3-Version wird via `cargo add` auf die neueste 3.14-kompatible gesetzt.

[features]
# Zaehlt GameState-Klone im Such-Hot-Path (mcts.rs/net_mcts.rs) via AtomicUsize.
# Nur fuers Profiling gedacht -- im Normalbetrieb aus (Zero-Cost, da wegkompiliert).
clone_profiling = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "clone_cost"
harness = false
