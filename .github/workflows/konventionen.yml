name: Konventionen

# Zweck: der Konventions-Linter laeuft auch dann, wenn der lokale Git-Haken
# fehlt oder mit --no-verify umgangen wurde. Bewusst NUR der Linter --
# `cargo test` bliebe hier haengen, weil PyO3 einen Python-Interpreter zum
# Linken braucht (lokal derselbe Grund fuer STATUS_DLL_NOT_FOUND ohne
# pythoncore im PATH), und Arena/Training/Paritaets-Probe sind ohnehin
# unmoeglich: models/ und data/ sind gitignored.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Aeltere Laeufe desselben Branches abbrechen -- bei mehreren Pushes
# hintereinander zaehlt nur der letzte Stand.
concurrency:
  group: konventionen-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keine Abhaengigkeiten zu installieren: tools/check_conventions.py ist
      # bewusst stdlib-only (argparse/json/re/subprocess/pathlib).
      - name: Konventions-Linter (ganzes Repo)
        run: python tools/check_conventions.py

      # Hinweis zur Groessen-Ratsche: die Basislinie in tools/size_baseline.json
      # wurde auf Windows mit CRLF-Arbeitskopie erzeugt. Auf dem Linux-Runner
      # sind dieselben Dateien mit LF kleiner -- die Ratsche schlaegt nur bei
      # WACHSTUM an und kann dadurch hier nicht falsch-positiv werden. Ein
      # Verstoss, den nur der lokale Haken sieht, ist damit moeglich; ein
      # Fehlalarm in der Cloud nicht. Diese Richtung ist die gewollte.
